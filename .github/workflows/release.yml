name: Release

# Publishes to npm via Changesets. On every push to the default branch this
# either opens/updates a "Version Packages" PR (accumulating changesets) or, when
# that PR is merged, builds and publishes the new version to npm with provenance.
#
# Requires a repository secret `NPM_TOKEN` (an npm automation token with publish
# rights). Provenance additionally needs the `id-token: write` permission below.

on:
  push:
    branches: [master]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Node is needed so `changeset publish` can run `npm publish` with an
      # authenticated registry and provenance.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: |
          bun run lint
          bun run typecheck
          bun test
          bun run build

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: bun run version
          publish: bun run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
