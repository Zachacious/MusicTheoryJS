name: Release

# Publishes to npm via Changesets. On every push to the default branch this
# either opens/updates a "Version Packages" PR (accumulating changesets) or, when
# that PR is merged, builds and publishes the new version to npm with provenance.
#
# Authentication to npm works one of two ways; pick one:
#   1. Automation token — add a repo secret NPM_TOKEN (npm Access Tokens →
#      Automation). Automation tokens skip 2FA in CI. Simplest and most reliable.
#   2. Trusted publishing (token-less) — configure a Trusted Publisher for this
#      package on npmjs.com (package Settings → Trusted Publisher → GitHub
#      Actions: repo Zachacious/MusicTheoryJS, workflow release.yml). Then no
#      secret is needed; the OIDC id-token permission below is used.
# Without either, npm falls back to your account's 2FA and the publish fails EOTP.

on:
  push:
    branches: [master]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Node is needed so `changeset publish` can run `npm publish` with an
      # authenticated registry and provenance.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) needs a recent npm CLI (>= 11.5.1).
      - name: Use a current npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: |
          bun run lint
          bun run typecheck
          bun test
          bun run build
          node scripts/e2e.mjs
          node scripts/e2e.cjs

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: bun run version
          publish: bun run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
