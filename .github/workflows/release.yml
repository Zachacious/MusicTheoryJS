name: Release

# Publishes to npm via Changesets. On every push to the default branch this
# either opens/updates a "Version Packages" PR (accumulating changesets) or, when
# that PR is merged, builds and publishes the new version to npm with provenance.
#
# Authentication is npm trusted publishing (OIDC), with no token: the package's
# Trusted Publisher on npmjs.com (Settings → Trusted Publisher → GitHub
# Actions: Zachacious/MusicTheoryJS, workflow release.yml) accepts this job's
# id-token in place of a password. Keep the file name release.yml and the push
# trigger; the publisher is bound to both. No NPM_TOKEN secret is read.

on:
  push:
    branches: [master]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Node is needed so `changeset publish` can run `npm publish` with an
      # authenticated registry and provenance.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) needs npm >= 11.5.1. Pinned to a major so a
      # new npm major (and its Node floor) can't break a release unannounced.
      - name: Use a current npm
        run: npm install -g npm@12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: |
          bun run lint
          bun run typecheck
          bun test
          bun run build
          node scripts/e2e.mjs
          node scripts/e2e.cjs
          node scripts/e2e-types.mjs

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: bun run version
          publish: bun run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
