name: CI

on:
  push:
    branches: [master, v3.0]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test (with coverage gate)
        run: bun run test:coverage

      - name: Build
        run: bun run build

      - name: Smoke test (npm pack → install → import every subpath)
        run: bun run smoke-test

      - name: Docs build
        run: bun run docs

  bench:
    # Informational only: shared runners make absolute numbers noisy.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Benchmarks
        run: bun run bench
